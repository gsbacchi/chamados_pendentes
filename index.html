<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal dos Chamados | Sistema de Tecnologia da Informação</title>

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <!-- ==========================================================
     EFEITO MATRIX
     Camada que aparece quando o usuário faz login.
========================================================== -->

    <div id="matrixOverlay">
        <canvas id="matrixCanvas"></canvas>
    </div>

    <div class="overlay"></div>

    <main class="stage">

        <section class="hero-globe">
            <canvas id="globeCanvas"></canvas>
        </section>
        <!-- Halo luminoso atrás da caixa de login -->
        <div class="login-halo"></div>
        <section class="login-side">

            <div class="login-card" id="loginCard">

                <header class="heading">
                    <h1>Portal dos Chamados</h1>

                    <div class="line"></div>

                    <p>SISTEMA DE TECNOLOGIA DA INFORMAÇÃO</p>
                </header>

                <form id="loginForm">

                    <div class="field">
                        <label for="user">Usuário</label>

                        <input id="user" type="text" placeholder="Digite sua matrícula">
                    </div>

                    <div class="field">
                        <label for="pass">Senha</label>
                        <!-- Mensagem de erro do login -->
                        <div id="loginErro" class="login-erro">
                            Usuário ou senha inválidos.
                        </div>

                        <div class="password-box">

                            <input id="pass" type="password" placeholder="Digite sua senha">

                            <button id="togglePass" type="button">
                                👁
                            </button>

                        </div>
                    </div>


                    <div class="options">

                        <label>
                            <input type="checkbox">
                            Lembrar meu usuário
                        </label>

                        <a href="#">Esqueceu a senha?</a>

                    </div>

                    <button class="login-btn" type="submit">
                        Entrar →
                    </button>

                </form>
                <div class="secure-note">
                    <svg fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        viewbox="0 0 24 24">
                        <rect height="10" rx="2" width="18" x="3" y="11">
                        </rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4">
                        </path>
                    </svg>
                    Conexão segura e criptografada
                </div>

            </div>

        </section>

    </main>

    <script src="js/login.js"></script>

</body>

</html>
